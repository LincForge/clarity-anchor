[project]
name = "clarity-anchor"
version = "0.1.0"
description = "Simulation: in-orbit calibration of a cheap thermospheric density gauge against host GNSS orbit decay"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pymsis>=0.13.0",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: long-running physics tests"]
